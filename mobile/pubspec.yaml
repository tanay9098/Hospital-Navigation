name: pes_hospital_nav
description: PES Hospital Electronic City – Indoor Navigation & IVR System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP client
  http: ^1.1.0

  # State management
  provider: ^6.1.1

  # Text-to-Speech for voice navigation
  flutter_tts: ^3.8.5

  # Local storage (accessibility pref, recent locations)
  shared_preferences: ^2.2.2

  # Phone / URL launcher (IVR call button)
  url_launcher: ^6.2.1

  # Animations
  flutter_animate: ^4.3.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
