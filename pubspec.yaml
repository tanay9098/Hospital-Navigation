name: hospital_nav
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  collection: ^1.19.1
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.4
  flutter_tts: ^4.2.5
  google_fonts: ^8.0.2
  pedometer: ^4.2.0
  permission_handler: ^12.0.1
  provider: ^6.1.5+1
  sensors_plus: ^7.0.0
  shared_preferences: ^2.5.5
  vector_math: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/maps/
    - assets/lang/

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo.jpg"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/logo.jpg"
  android: true
  ios: true
  android_12:
    image: "assets/logo.jpg"
    color: "#FFFFFF"
